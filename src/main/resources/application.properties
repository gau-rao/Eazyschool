spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.javax.persistence.validation.mode=none
spring.data.rest.basePath=/data-api


logging.level.root=INFO
#logging.level.com.easybytes.eazyschool.aspects = ERROR
#logging.level.com.easybytes.eazyschool.Controller = ERROR

# Initialize log group eazyschool_error
logging.group.eazyschool_error=com.easybytes.eazyschool.aspects, com.easybytes.eazyschool.Controller
# Set log level to log group eazyschool_error
logging.level.eazyschool_error=ERROR

spring.output.ansi.enabled=ALWAYS

